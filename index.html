<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  />

  <meta
    http-equiv="Pragma"
    content="no-cache"
  />

  <meta
    http-equiv="Expires"
    content="0"
  />

  <title>GUBI Community Hub</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="./style.css?v=20260925-5"
  />
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="top">

      <div class="brand">

        <div class="snow-logo">
          ❄️
        </div>

        <div>
          <h1>
            GUBI COMMUNITY HUB
          </h1>

          <p>
            GUBI eats the market.
          </p>
        </div>

      </div>

      <div class="welcome">

        <p id="hello">
          Welcome to the snow 👀
        </p>

      </div>

    </header>

    <!-- STATS -->
    <section class="stats">

      <div class="stat">

        <span>
          Level
        </span>

        <strong id="level">
          1
        </strong>

      </div>

      <div class="stat">

        <span>
          XP
        </span>

        <strong id="xp">
          0
        </strong>

      </div>

      <div class="stat">

        <span>
          Rank
        </span>

        <strong id="rank">
          —
        </strong>

      </div>

    </section>

    <!-- MAIN CONTENT -->
    <main
      id="screen"
      class="screen"
    >

      <h2>
        ❄️ Entering the snow...
      </h2>

      <p>
        Loading your GUBI profile.
      </p>

    </main>

    <!-- TOKEN NOTICE -->
    <div class="token-notice">

      ⚠️ NO OFFICIAL GUBI TOKEN YET

    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav>

    <button
      type="button"
      data-page="home"
      class="active"
    >

      <span class="nav-icon">
        🏠
      </span>

      <span>
        Home
      </span>

    </button>

    <button
      type="button"
      data-page="missions"
    >

      <span class="nav-icon">
        ⚡
      </span>

      <span>
        Missions
      </span>

    </button>

    <button
      type="button"
      data-page="raids"
    >

      <span class="nav-icon">
        📣
      </span>

      <span>
        Raids
      </span>

    </button>

    <button
      type="button"
      data-page="leaders"
    >

      <span class="nav-icon">
        🏆
      </span>

      <span>
        Ranks
      </span>

    </button>

    <button
      type="button"
      data-page="profile"
    >

      <span class="nav-icon">
        👤
      </span>

      <span>
        Profile
      </span>

    </button>

  </nav>

  <!--
    Cache version changed to force Telegram
    to load the new Missions system.
  -->
  <script src="./script.js?v=20260925-5"></script>

</body>
</html>
