<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#e7f6ff"
  >

  <title>GUBI Community Hub</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="./style.css?v=20260928-1"
  >

  <!-- App functionality -->
  <script
    defer
    src="./script.js?v=20260928-1"
  ></script>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="top">

      <div class="hero-art">
        <img
          class="hero-image"
          src="./assets/gubi-hero.png"
          alt="GUBI welcomes you to the snowy mountains"
          fetchpriority="high"
        >

        <img
          class="brand-logo"
          src="./assets/gubi-logo.png"
          alt="GUBI Community Hub"
        >
      </div>

      <div class="welcome">
        <h1>GUBI eats the market.</h1>

        <p id="hello">
          Welcome to the snow.
        </p>
      </div>

    </header>

    <div class="hub-body">

      <!-- LEVEL -->
      <section
        class="level-card frost"
        aria-label="Level progress"
      >
        <div
          id="levelBadge"
          class="level-gem"
          aria-hidden="true"
        >
          1
        </div>

        <div class="level-info">
          <div class="level-heading">
            <h2>
              Level <span id="level">1</span>
            </h2>

            <span id="levelProgressText">
              0 / 100 XP
            </span>
          </div>

          <progress
            id="levelProgress"
            max="100"
            value="0"
            aria-label="Progress to next level"
          >
            0%
          </progress>
        </div>
      </section>

      <!-- STATS -->
      <section
        class="stats"
        aria-label="Your stats"
      >

        <div class="stat frost">
          <span
            class="stat-symbol"
            aria-hidden="true"
          >
            🔥
          </span>

          <div>
            <span class="stat-label">
              Streak
            </span>

            <strong id="streak">
              0 days
            </strong>
          </div>
        </div>

        <div class="stat frost">
          <span
            class="stat-symbol star"
            aria-hidden="true"
          >
            ★
          </span>

          <div>
            <span class="stat-label">
              XP
            </span>

            <strong id="xp">
              0
            </strong>
          </div>
        </div>

        <div class="stat frost">
          <span
            class="stat-symbol"
            aria-hidden="true"
          >
            🏆
          </span>

          <div>
            <span class="stat-label">
              Rank
            </span>

            <strong id="rank">
              —
            </strong>
          </div>
        </div>

      </section>

      <!-- DYNAMIC CONTENT -->
      <main
        id="screen"
        class="screen frost"
        aria-busy="true"
      >
        <h2>Entering the snow...</h2>

        <p>
          Loading your GUBI profile.
        </p>
      </main>

      <!-- TOKEN NOTICE -->
      <p class="token-notice">
        NO OFFICIAL GUBI TOKEN YET
      </p>

    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav aria-label="Main navigation">

    <button
      type="button"
      data-page="home"
      class="active"
      aria-current="page"
    >
      <span
        class="nav-icon"
        data-icon="home"
      ></span>

      <span>Home</span>
    </button>

    <button
      type="button"
      data-page="missions"
    >
      <span
        class="nav-icon"
        data-icon="missions"
      ></span>

      <span>Missions</span>
    </button>

    <button
      type="button"
      data-page="raids"
    >
      <span
        class="nav-icon"
        data-icon="raids"
      ></span>

      <span>Raids</span>
    </button>

    <button
      type="button"
      data-page="leaders"
    >
      <span
        class="nav-icon"
        data-icon="trophy"
      ></span>

      <span>Ranks</span>
    </button>

    <button
      type="button"
      data-page="profile"
    >
      <span
        class="nav-icon"
        data-icon="profile"
      ></span>

      <span>Profile</span>
    </button>

  </nav>
</body>
</html>
